version: 2

models:
  - name: int_snapchat_ads_stats
    description: "Daily Snapchat ad performance metrics with calculated efficiency measures."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ad_id
              - ad_country
              - ad_date
    columns:
      - name: ad_id
        description: "Identifier of the Snapchat ad."
        data_tests:
          - not_null

      - name: account_id
        description: "Identifier of the advertising account associated with the ad's campaign."

      - name: ad_country
        description: "Country code reported for the ad performance row."

      - name: ad_currency_code
        description: "Currency code reported for the ad performance row."

      - name: ad_spend
        description: "Amount spent on the ad for the day."
      - name: ad_impressions
        description: "Number of impressions delivered by the ad for the day."
      - name: ad_clicks
        description: "Number of clicks received by the ad for the day."
      - name: ad_date
        description: "Date on which the ad performance was recorded."
        data_tests:
          - not_null
      - name: data_src
        description: "Source identifier supplied by the Snapchat statistics source."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - snapchat_ads
      - name: ad_ctr
        description: "Click-through rate, calculated as clicks divided by impressions."
      - name: ad_cpc
        description: "Cost per click, calculated as spend divided by clicks."
      - name: ad_cpm
        description: "Cost per thousand impressions, calculated as spend divided by impressions multiplied by 1,000."
