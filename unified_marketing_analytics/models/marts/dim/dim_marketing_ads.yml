version: 2

models:
  - name: dim_marketing_ads
    description: "Unified ad dimension containing Facebook and Snapchat ad attributes. The source column distinguishes records across channels."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - data_src
              - ad_id
    columns:
      - name: ad_key
        description: "Stable surrogate key generated from the source platform and ad identifier."
        data_tests:
          - not_null
          - unique
      - name: ad_id
        description: "Natural ad identifier supplied by the source platform."
        data_tests:
          - not_null
      - name: ad_group_id
        description: "Identifier of the ad group containing the ad."
      - name: campaign_id
        description: "Identifier of the campaign containing the ad."
      - name: account_id
        description: "Identifier of the advertising account associated with the ad."
      - name: ad_name
        description: "Name of the ad."
      - name: ad_status
        description: "Configured ad status when supplied by the source."
      - name: ad_group_name
        description: "Name of the ad group."
      - name: campaign_name
        description: "Name of the campaign."
      - name: account_name
        description: "Name of the advertising account when supplied by the source."
      - name: channel_name
        description: "Standardized marketing channel."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Paid Social
      - name: ad_detail_updated_at
        description: "Most recent available update timestamp for the ad details."
      - name: data_src
        description: "Source platform identifier."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - facebook_ads
                  - snapchat_ads
