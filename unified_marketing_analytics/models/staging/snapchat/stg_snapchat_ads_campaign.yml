version: 2

models:
  - name: stg_snapchat_ads_campaign
    description: "Staging model for Snapchat campaign data."
    columns:
      - name: campaign_id
        description: "Unique identifier for the Snapchat campaign."
        tests:
          - unique
          - not_null
      - name: account_id
        description: "Identifier of the ad account that owns the campaign."
      - name: campaign_name
        description: "Name of the Snapchat campaign."
