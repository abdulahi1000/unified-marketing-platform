version: 2

models:
  - name: stg_snapchat_ads
    description: "Staging model for Snapchat ads, with ad-level identifiers and metadata."
    columns:
      - name: ad_id
        description: "Unique identifier for the Snapchat ad."
        tests:
          - unique
          - not_null
      - name: ad_group_id
        description: "Identifier of the ad group containing the ad."
      - name: ad_name
        description: "Name of the Snapchat ad."
      - name: ad_updated_at
        description: "Timestamp when the ad was last updated."
