version: 2

models:
  - name: stg_facebook_ads_campaign
    description: "Facebook Ads campaign data."
    columns:
      - name: campaign_id
        description: "Unique identifier for the campaign."
        tests:
          - unique
          - not_null
      - name: account_id
        description: "ID of the ad account that owns the campaign."
      - name: campaign_name
        description: "Name of the campaign."
      - name: campaign_updated_at
        description: "Timestamp when the campaign was last updated."
