unified_marketing_analytics:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"

  meta:
    base: &base
      type: databricks
      auth_type: oauth
      threads: 8
      http_path: "{{ env_var('HTTP_PATH') }}"
      host: "{{ env_var('DATABRICKS_HOST') }}"

    base_auth: &base_auth
      type: databricks
      auth_type: oauth
      client_id: "{{ env_var('DATABRICKS_CLIENT_ID') }}"
      client_secret: "{{ env_var('DATABRICKS_CLIENT_SECRET') }}"
      threads: 8
      connect_retries: 30
      retry_all: true
      http_path: "{{ env_var('HTTP_PATH') }}"
      host: "{{ env_var('DATABRICKS_HOST') }}"

  outputs:
    dev: &dev_service_account
      <<: *base
      schema: "{{ env_var('DEV_SCHEMA') }}"
      catalog: "{{ env_var('DEV_CATALOG') }}"
      databricks_pat_token: "{{ env_var('DATABRICKS_PAT_TOKEN') }}"

    ci: &ci_service_account
      <<: *base_auth
      catalog: ci_development
      schema: "{{ env_var('DEV_SCHEMA') }}"

    staging: &staging_service_account
      <<: *ci_service_account
      catalog: gold_staging
      schema: analytics

    production: &production_service_account
      <<: *base_auth
      catalog: gold_production
      schema: analytics

      
## DATABRICKS ##
## By default, edr expects the profile name 'elementary'.      ##
## Configure the database and schema of elementary models.     ##
## Check where 'elementary_test_results' is to find it.        ##

elementary:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      <<: *dev_service_account
    ci:
      <<: *ci_service_account
    production:
      <<: *production_service_account

    staging:
      <<: *staging_service_account
